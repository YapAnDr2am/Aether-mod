name: Build Geode Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@v1
        id: build
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Android
          path: ${{ steps.build.outputs.build-output }}
